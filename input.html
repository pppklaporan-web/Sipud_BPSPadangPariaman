<!DOCTYPE html>
<html>
<head>
  <title>SIPUD - Input Usaha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <!-- PWA basic -->
  <meta name="theme-color" content="#2c7be5">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #2c7be5;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    .checkbox-group {
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2c7be5;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
    }

    button:disabled {
      background: gray;
    }

    /* Toast Notifikasi */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #28a745;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      display: none;
    }

    .loading {
      text-align: center;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="header">SIPUD - Sistem Registrasi Pendataan Usaha Digital</div>

<div class="container">
  <div class="card">

    <label>Petugas</label>
    <select id="petugas">
    <option>Loading...</option>
    </select>
    
    <input id="nama_usaha" placeholder="Nama Usaha">
    <input id="nama_pemilik" placeholder="Nama Pemilik">
    <input id="no_hp" placeholder="No HP">

    <label>Kategori Usaha</label>
    <select id="kategori">
      <option>Perdagangan Online Rumahan</option>
      <option>Perdagangan Online Berbangunan</option>
      <option>Usaha Transaksi Digital</option>
      <option>Transportasi Online</option>
    </select>

    <label>Platform</label>
    <select id="platform">
      <option>Shopee</option>
      <option>Tokopedia</option>
      <option>Lainnya</option>
    </select>

    <label>Metode Pembayaran</label>
    <div class="checkbox-group">
      <input type="checkbox" value="QRIS"> QRIS
      <input type="checkbox" value="OVO"> OVO
      <input type="checkbox" value="DANA"> DANA
      <input type="checkbox" value="Gopay"> Gopay
      <input type="checkbox" value="Transfer Bank"> Transfer Bank
    </div>

    <label>Foto Usaha</label>
    <input type="file" id="foto">

    <button id="btnKirim" onclick="kirim()">Kirim Data</button>

    <div class="loading" id="loading">Mengirim data...</div>

  </div>
</div>

<div class="toast" id="toast">Data berhasil dikirim!</div>

<script>
let lat="", lng="";

navigator.geolocation.getCurrentPosition(pos=>{
  lat = pos.coords.latitude;
  lng = pos.coords.longitude;
});

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.display = "none";
  }, 3000);
}

function resetForm(){
  document.querySelectorAll("input").forEach(i=>{
    if(i.type !== "file") i.value = "";
    if(i.type === "checkbox") i.checked = false;
  });
}

function kirim(){
  
  // ✅ VALIDASI DI SINI (PALING ATAS)
  if (!document.getElementById("petugas").value) {
    alert("Petugas belum dipilih!");
    return;
  }

  const btn = document.getElementById("btnKirim");
  const loading = document.getElementById("loading");

  const metode = [...document.querySelectorAll("input[type=checkbox]:checked")]
    .map(e=>e.value);

  const file = document.getElementById("foto").files[0];
  const reader = new FileReader();

  btn.disabled = true;
  loading.style.display = "block";

  reader.onloadend = function(){
    const base64 = reader.result ? reader.result.split(",")[1] : "";

    fetch("https://script.google.com/macros/s/AKfycbwQCMCPesfyR2kDZ2oBlHgWec0GVvGHTyKobkRgBP8XJZ0Ca83XnvhUE4kCHUti-hCz/exec", {
      method:"POST",
      body: JSON.stringify({
        petugas: document.getElementById("petugas").value || "Tidak diketahui",
        nama_usaha: document.getElementById("nama_usaha").value,
        nama_pemilik: document.getElementById("nama_pemilik").value,
        no_hp: document.getElementById("no_hp").value,
        kategori: document.getElementById("kategori").value,
        platform: document.getElementById("platform").value,
        metode: metode,
        lat: lat,
        lng: lng,
        foto: base64
      })
    })
    .then(res=>res.json())
    .then(()=>{
      showToast("✅ Data berhasil dikirim");
      resetForm();
    })
    .catch(()=>{
      showToast("❌ Gagal kirim data");
    })
    .finally(()=>{
      btn.disabled = false;
      loading.style.display = "none";
    });
  };

  if(file){
    reader.readAsDataURL(file);
  } else {
    reader.onloadend();
  }
}

// 🔥 Load data petugas ke dropdown
fetch("https://script.google.com/macros/s/AKfycbwQCMCPesfyR2kDZ2oBlHgWec0GVvGHTyKobkRgBP8XJZ0Ca83XnvhUE4kCHUti-hCz/exec?petugas=true")
.then(res => res.json())
.then(data => {
  const select = document.getElementById("petugas");
  select.innerHTML = ""; // hapus loading

  data.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p[0];
    opt.innerText = p[0];
    select.appendChild(opt);
  });
})
.catch(() => {
  document.getElementById("petugas").innerHTML = "<option>Gagal load</option>";
});
</script>

</body>
</html>
