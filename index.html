<!DOCTYPE html>
<html>
<head>
  <title>SIPUD - Input Usaha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2c7be5">

  <!-- CSS External -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <img src="bps.png" class="logo">
  </div>

  <div class="header-center">
    <div class="title-main">SIPUD</div>
    <div class="title-sub">Sistem Registrasi Pendataan Usaha Digital</div>
    <div class="title-instansi">BPS Kabupaten Padang Pariaman</div>
  </div>

  <div class="header-right">
    <img src="se.png" class="logo">
  </div>
</div>

<!-- FORM -->
<div class="container">
  <div class="card">

    <label>Petugas</label>
    <select id="petugas">
      <option>Loading...</option>
    </select>

    <input id="nama_usaha" placeholder="Nama Usaha">
    <input id="nama_pemilik" placeholder="Nama Pemilik">
    <input id="no_hp" placeholder="No HP">

    <label>Kategori Usaha</label>
    <select id="kategori">
      <option>Perdagangan Online Rumahan</option>
      <option>Perdagangan Online Berbangunan</option>
      <option>Usaha Transaksi Digital</option>
      <option>Transportasi Online</option>
    </select>

    <label>Platform</label>
    <select id="platform">
      <option>Shopee</option>
      <option>Tokopedia</option>
      <option>Lainnya</option>
    </select>

    <label>Metode Pembayaran</label>
    <div class="checkbox-group">
      <input type="checkbox" value="QRIS"> QRIS
      <input type="checkbox" value="OVO"> OVO
      <input type="checkbox" value="DANA"> DANA
      <input type="checkbox" value="Gopay"> Gopay
      <input type="checkbox" value="Transfer Bank"> Transfer Bank
    </div>

    <label>Foto Usaha</label>
    <input type="file" id="foto">

    <button id="btnKirim">Kirim Data</button>

  </div>
</div>

<div class="toast" id="toast"></div>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <img src="bps.png" class="loading-logo">
    <div class="loading-text">Mengirim data...</div>
  </div>
</div>

<!-- JS External -->
<script src="js/app.js"></script>

</body>
</html>
