<!DOCTYPE html>
<html>
<head>
  <title>SIPUD Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

  <h2 class="section-title">
    <i class="fa-solid fa-chart-line title-icon"></i>
    SIPUD Dashboard
  </h2>

  <!-- KPI -->
  <div class="grid">
    <div class="card">
      <div class="kpi-title">
        <i class="fa-solid fa-briefcase"></i> Total Usaha
      </div>
      <div class="kpi" id="total">0</div>
    </div>

    <div class="card">
      <div class="kpi-title">
        <i class="fa-solid fa-users"></i> Petugas Aktif
      </div>
      <div class="kpi" id="petugas">0</div>
    </div>
  </div>

  <!-- GRAFIK -->
  <div class="grid" style="margin-top:10px">

    <div class="card">
      <div class="section-title">
        <i class="fa-solid fa-chart-column"></i>
        Usaha per Petugas
      </div>
      <canvas id="chartPetugas"></canvas>
    </div>

    <div class="card">
      <div class="section-title">
        <i class="fa-solid fa-chart-pie"></i>
        Kategori Usaha
      </div>
      <canvas id="chartKategori"></canvas>
    </div>

  </div>

  <!-- MAP -->
  <div class="card" style="margin-top:10px">
    <div class="section-title">
      <i class="fa-solid fa-map-location-dot"></i>
      Peta Usaha
    </div>
    <div id="map"></div>
  </div>

</div>

<!-- JS -->
<script src="js/script.js"></script>

</body>
</html>
