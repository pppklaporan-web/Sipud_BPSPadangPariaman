<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPUD Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0B1F3A,#163B65);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:white;
    color:#222;
    padding:35px;
    border-radius:20px;
    width:320px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}
.logo{
    font-size:28px;
    font-weight:bold;
    color:#0B1F3A;
}
.sub{
    margin-bottom:25px;
    color:#777;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#C9A227;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}
button:hover{
    opacity:.9;
}
</style>
</head>

<body>

<div class="box">
    <div class="logo">SIPUD</div>
    <div class="sub">Sistem Informasi Pendataan</div>

    <button onclick="loginGoogle()">Login dengan Gmail</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
